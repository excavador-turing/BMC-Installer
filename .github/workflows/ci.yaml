name: CI

on:
  pull_request:
  push:
    branches: [master, ci-nandsim] # TEMP
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check bans licenses sources

  nandsim:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install MTD tools and nandsim module
        run: |
          sudo apt-get update
          if ! apt-cache show "linux-modules-extra-$(uname -r)" >/dev/null 2>&1; then
            echo "::error::linux-modules-extra-$(uname -r) is not available for this runner kernel; nandsim cannot be loaded"
            exit 1
          fi
          sudo apt-get install -y mtd-utils erofs-utils "linux-modules-extra-$(uname -r)"
      - name: TEMP modprobe probe
        run: |
          uname -r
          sudo modprobe nandsim first_id_byte=0x20 second_id_byte=0xaa third_id_byte=0x00 fourth_id_byte=0x15
          cat /proc/mtd
          sudo rmmod nandsim
      - run: cargo build --release --bin install_on_mtd
      - run: sudo tests/nandsim.sh target/release/install_on_mtd

  armv7:
    # Buildroot target of the Turing Pi 2 BMC: soft-float armv7 glibc (see .cargo/config).
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABI_LINKER: arm-linux-gnueabi-gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          targets: armv7-unknown-linux-gnueabi
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabi
      - run: cargo build --release --target armv7-unknown-linux-gnueabi --bin sdcard --bin sdcard_userspace
